<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dog Days</title>

  <style>
    :root{
      --accent: #2BC2BF;
      --onAccent: #ffffff;
      --accent20: rgba(43,194,191,0.20);
      --bg: #ffffff;
      --text: #0b0b0f;
      --surface: #f2f2f7;
      --stroke: rgba(60,60,67,0.29);
    }

    @media (prefers-color-scheme: dark){
      :root{
        --bg: #000000;
        --text: #ffffff;
        --surface: #1c1c1e;
        --stroke: rgba(84,84,88,0.65);
      }
    }

    *{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background-color: #d9f0ee;
  background:
    radial-gradient(1000px 700px at 15% 10%, rgba(43,194,191,0.55), transparent 65%),
    radial-gradient(800px 600px at 85% 20%, rgba(43,194,191,0.35), transparent 60%),
    linear-gradient(135deg, rgba(43,194,191,0.35), #d9f0ee);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: clamp(32px, 8vh, 64px) 28px;
  font-family: ui-rounded, -apple-system, system-ui, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #0b0b0f;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}



    .wrap{
      width: min(680px, 100%);
      text-align:center;
    }

.rufus-logo{
  display: block;
  width: clamp(92px, 16vw, 132px);
  height: auto;
  margin: 0 auto 22px;
  filter: drop-shadow(0 12px 22px rgba(11, 11, 15, 0.14));
}

h1{
  margin: 0 0 8px;
  font-size: clamp(56px, 9vw, 92px);
  font-weight: 800;
  letter-spacing: 0.02em;
  color: #0b0b0f;
}

.tagline{
  margin: 0 0 10px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: clamp(23px, 3vw, 30px);
  font-weight: 650;
  letter-spacing: 0;
  color: #0b0b0f;
}

.slogan{
  margin: 0 0 36px;
  font-size: clamp(15px, 2vw, 18px);
  font-weight: 550;
  opacity: 0.72;
  color: #0b0b0f;
}


    .store-badge{
      display:inline-block;
      height: 56px;
    }
    .store-badge img{
      height: 100%;
      width: auto;
      display: block;
    }

    .links{
      margin-top: 32px;
      display:flex;
      justify-content:center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 14px;
      opacity: 0.9;
    }
.links a{
  color: #0b0b0f;
  text-decoration:none;
  border-bottom: 1px solid transparent;
}

    .links a:hover{
      border-bottom-color: rgba(255,255,255,0.5);
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <img
      class="rufus-logo"
      src="assets/rufus-logo.png"
      alt="Rufus, the Dog Days logo"
      width="384"
      height="336"
      decoding="async"
    />
    <h1>Dog Days</h1>
    <div class="tagline">Track with your pack.</div>
    <div class="slogan">Stop the sh💩t talk.</div>

<a
  class="store-badge"
  href="https://apps.apple.com/us/app/dog-days-track-with-your-pack/id6758313165"
  target="_blank"
  rel="noopener noreferrer"
>
  <img
    src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
    alt="Download on the App Store"
  />
</a>


    <div class="links">
      <a href="terms/">Terms</a>
      <a href="privacy/">Privacy</a>
      <a href="https://www.instagram.com/dogdaysapp/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="mailto:support@dog-days-app.com?subject=Dog%20Days%20Support%20Request">Support</a>
    </div>
  </main>
</body>
</html>
